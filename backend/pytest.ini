[pytest]
testpaths = tests
# Put `backend/` itself on sys.path so `import app` and the cross-module
# `from tests.test_api import state` both resolve, whatever directory pytest
# is invoked from.
pythonpath = .
# The API walkthrough builds on itself: a block needs trips, which need a
# pattern, which needs stops; the roster and itinerary suites then build on
# that network. Running in declaration order is intentional, not an accident
# of collection.
addopts = -p no:randomly -q
