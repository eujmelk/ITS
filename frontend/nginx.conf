server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API, so the browser needs no CORS and no separate host.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF generation for a large board can take a while.
        proxy_read_timeout 180s;
    }

    # Hashed build assets never change under the same name. `^~` so this wins
    # over the image regex below, which would otherwise claim /assets/*.png.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static images (favicon, logo) must 404 when absent rather than falling
    # through to the SPA — a request for a missing .ico that answers with HTML
    # is a genuinely confusing thing to debug.
    location ~* \.(ico|bmp|png|jpe?g|gif|svg|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Client-side routing: every unknown path is handled by the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
